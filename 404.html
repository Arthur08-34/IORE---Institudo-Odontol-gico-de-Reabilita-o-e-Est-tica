<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests">
<title>404 - Página não encontrada | IORE</title>
<style>
  :root {
    --navy: #1e2d4e;
    --gold: #c9a84c;
    --gold-light: #e8c87a;
    --cream: #faf8f3;
    --dark: #12192a;
    --text: #2e2e2e;
    --muted: #6b7280;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--cream);
    color: var(--text);
    display: grid;
    place-items: center;
    padding: 32px 18px;
  }

  main {
    width: min(760px, 100%);
    text-align: center;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: var(--navy);
    text-decoration: none;
    margin-bottom: 42px;
  }

  .brand-mark {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--gold);
    color: var(--dark);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 21px;
    font-weight: 700;
  }

  .brand-text {
    text-align: left;
    line-height: 1.05;
  }

  .brand-name {
    display: block;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--navy);
  }

  .brand-sub {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .status {
    display: inline-block;
    margin-bottom: 22px;
    padding: 7px 14px;
    border: 1px solid rgba(201,168,76,.45);
    border-radius: 999px;
    color: var(--navy);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  h1 {
    max-width: 660px;
    margin: 0 auto 18px;
    color: var(--dark);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(40px, 8vw, 78px);
    line-height: 1;
    font-weight: 400;
  }

  p {
    max-width: 540px;
    margin: 0 auto;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.7;
  }

  .actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 34px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 24px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    transition: transform .2s, background .2s, border-color .2s;
  }

  .btn-primary {
    background: var(--gold);
    color: var(--dark);
  }

  .btn-primary:hover {
    background: var(--gold-light);
    transform: translateY(-2px);
  }

  .btn-secondary {
    border: 1px solid rgba(30,45,78,.2);
    color: var(--navy);
    background: var(--white);
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
  }

  .note {
    margin-top: 46px;
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main>
    <a class="brand" href="/index.html" aria-label="Voltar para a página inicial do IORE">
      <span class="brand-mark">IO</span>
      <span class="brand-text">
        <span class="brand-name">IORE</span>
        <span class="brand-sub">Odontologia Premium</span>
      </span>
    </a>

    <div class="status">Erro 404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço pode ter mudado, sido removido ou digitado incorretamente. Você pode voltar para o site principal ou falar com a clínica pelo WhatsApp.</p>

    <div class="actions">
      <a class="btn btn-primary" href="/index.html">Voltar ao site</a>
      <a class="btn btn-secondary" href="https://wa.me/5517997760055?text=Ol%C3%A1!%20Gostaria%20de%20agendar%20uma%20consulta%20no%20IORE.">Falar no WhatsApp</a>
    </div>

    <p class="note">IORE - Instituto Odontológico de Reabilitação e Estética</p>
  </main>
</body>
</html>
